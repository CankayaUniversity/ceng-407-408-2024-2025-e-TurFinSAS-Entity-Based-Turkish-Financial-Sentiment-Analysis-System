<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Ticker Bazlı Tahmin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="mb-4 text-center">📈 Hisse Tahmin Sistemi</h2>

        {% if result %}
            <div class="alert alert-success">
                <strong>Tahmin Sonucu:</strong> {{ result }}%
            </div>
        {% elif error %}
            <div class="alert alert-danger">
                <strong>Hata:</strong> {{ error }}
            </div>
        {% endif %}

        <form method="post">
            <div class="mb-3">
                <label for="ticker" class="form-label">Tahmin etmek istediğiniz hisse:</label>
                <select name="ticker" id="ticker" class="form-select" required>
                    {% for t in tickers %}
                        <option value="{{ t }}">{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Tahmini Göster</button>
        </form>
    </div>
</div>

</body>
</html>
